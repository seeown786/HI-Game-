<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yellow Bird Adventure - 10 Levels</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #222; font-family: sans-serif; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui { position: absolute; top: 20px; left: 20px; color: white; pointer-events: none; text-shadow: 2px 2px 4px #000; z-index: 10; }
        #level-txt { font-size: 24px; font-weight: bold; color: #FFD700; }
        #turns-txt { font-size: 18px; color: #fff; margin-top: 5px; }
        #msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #FFD700; font-size: 35px; font-weight: bold; display: none; text-align: center; text-shadow: 3px 3px 6px #000; z-index: 20; background: rgba(0,0,0,0.7); padding: 20px; border-radius: 15px; width: 80%; }
    </style>
</head>
<body>
    <div id="ui">
        <div id="level-txt">Level: 1</div>
        <div id="turns-txt">Turns Left: 5</div>
    </div>
    <div id="msg"></div>

    <script>
        const { Engine, Render, Runner, World, Bodies, Mouse, MouseConstraint, Constraint, Events, Composite } = Matter;

        let engine, render, runner, world, bird, sling, mouseConstraint;
        let currentLevel = 1;
        let turns = 5;
        let isFired = false;
        let birdStartPos = { x: 200, y: 0 }; 

        function initGame() {
            engine = Engine.create();
            world = engine.world;
            
            const w = window.innerWidth;
            const h = window.innerHeight;
            birdStartPos.y = h - 200;

            render = Render.create({
                element: document.body,
                engine: engine,
                options: {
                    width: w,
                    height: h,
                    wireframes: false,
                    background: '#87CEEB' // Sky Blue Theme
                }
            });

            Render.run(render);
            runner = Runner.create();
            Runner.run(runner, engine);

            setupLevel(currentLevel);
            addInteractions();
        }

        function setupLevel(lvl) {
            World.clear(world);
            Engine.clear(engine);
            isFired = false;
            
            // Level wise turns/points
            turns = 5 + Math.floor(lvl / 2); 
            updateUI();

            const w = window.innerWidth;
            const h = window.innerHeight;

            // Ground & Walls
            const ground = Bodies.rectangle(w/2, h - 10, w, 40, { isStatic: true, render: { fillStyle: '#2ecc71' } });
            
            // Yellow Cute Bird Character
            bird = Bodies.circle(birdStartPos.x, birdStartPos.y, 25, {
                restitution: 0.6,
                render: { fillStyle: '#FFD700', strokeStyle: '#333', lineWidth: 3 }
            });

            // Clean Slingshot (No wavy rope)
            sling = Constraint.create({
                pointA: { x: birdStartPos.x, y: birdStartPos.y },
                bodyB: bird,
                stiffness: 0.1,
                length: 2,
                render: { strokeStyle: '#4d2911', lineWidth: 6 }
            });

            World.add(world, [ground, bird, sling]);
            createObstacles(lvl);
        }

        function createObstacles(lvl) {
            const w = window.innerWidth;
            const h = window.innerHeight;
            const startX = w - (w > 600 ? 400 : 250); // Mobile responsive adjustment
            const startY = h - 60;
            
            const rows = 2 + Math.floor(lvl / 2);
            const cols = 2 + (lvl % 3);

            for (let i = 0; i < rows; i++) {
                for (let j = 0; j < cols; j++) {
                    const block = Bodies.rectangle(startX + (j * 60), startY - (i * 65), 50, 60, {
                        render: { 
                            fillStyle: i % 2 === 0 ? '#e67e22' : '#d35400',
                            strokeStyle: '#fff',
                            lineWidth: 1
                        }
                    });
                    World.add(world, block);
                }
            }
        }

        function addInteractions() {
            const mouse = Mouse.create(render.canvas);
            mouseConstraint = MouseConstraint.create(engine, {
                mouse: mouse,
                constraint: { stiffness: 0.1, render: { visible: false } }
            });
            World.add(world, mouseConstraint);

            // Bird reset logic
            Events.on(engine, 'afterUpdate', () => {
                if (isFired && bird.position.x > window.innerWidth || (isFired && bird.speed < 0.2)) {
                    resetBird();
                }
            });

            render.canvas.addEventListener('mouseup', () => {
                if (mouseConstraint.body === bird) {
                    setTimeout(() => {
                        sling.bodyB = null;
                        isFired = true;
                        turns--;
                        updateUI();
                    }, 20);
                }
            });
        }

        function resetBird() {
            if (!isFired) return;
            isFired = false;
            
            if (turns <= 0) {
                showMessage("Turns Finish! Restarting Level...");
                setTimeout(() => setupLevel(currentLevel), 1500);
                return;
            }

            // Respawn bird at slingshot
            World.remove(world, bird);
            bird = Bodies.circle(birdStartPos.x, birdStartPos.y, 25, {
                render: { fillStyle: '#FFD700', strokeStyle: '#333', lineWidth: 3 }
            });
            sling.bodyB = bird;
            World.add(world, bird);

            // Simple Win Check: Agar saare blocks hil jayein (Aap isay manually next level kar sakte hain demo ke liye)
            const bodies = Composite.allBodies(world);
            if (bodies.length < 5 && currentLevel < 10) {
                currentLevel++;
                showMessage("Level Cleared! Next: " + currentLevel);
                setTimeout(() => setupLevel(currentLevel), 1500);
            }
        }

        function updateUI() {
            document.getElementById('level-txt').innerText = "Level: " + currentLevel;
            document.getElementById('turns-txt').innerText = "Turns Left: " + turns;
        }

        function showMessage(txt) {
            const m = document.getElementById('msg');
            m.innerText = txt;
            m.style.display = 'block';
            setTimeout(() => m.style.display = 'none', 1500);
        }

        window.addEventListener('resize', () => {
            render.canvas.width = window.innerWidth;
            render.canvas.height = window.innerHeight;
            initGame(); // Re-init on resize
        });

        initGame();
    </script>
</body>
</html>
